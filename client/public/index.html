<!doctype html>
<html>
  <head>
    <!-- Viewport meta for mobile responsiveness -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Sketchcord</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Sketchcord</h1>

    <!-- Username login screen — shown before chat -->
    <div id="login">
      <h2>Enter your username</h2>
      <input
        type="text"
        id="usernameInput"
        placeholder="Username"
        maxlength="20"
      />
      <!--  Color picker for username and drawing color -->
      <label for="colorInput">Pick your color:</label>
      <input type="color" id="colorInput" value="#000000" />
      <button id="joinBtn">Join</button>
    </div>

    <div id="app" style="display: none">
      <!-- Show logged-in username -->
      <div id="userBar">Logged in as: <span id="displayName"></span></div>
      <div id="thread"></div>

      <div id="messaging">
        <div id="userDisplay"></div>
        <h2>Draw your message</h2>
        <canvas id="drawingCanvas"></canvas>
        <div id="controls">
          <button id="clearBtn">Clear</button>
          <button id="sendBtn">Send</button>
        </div>
        <div id="colors">
          <button class="color_button", data-color="black"></button>
          <button class="color_button", data-color="white"></button>
          <button class="color_button", data-color="red"></button>
          <button class="color_button", data-color="orange"></button>
          <button class="color_button", data-color="yellow"></button>
          <button class="color_button", data-color="green"></button>
          <button class="color_button", data-color="blue"></button>
          <button class="color_button", data-color="purple"></button>
          <input type="color" id="colorPicker">
        </div>
      </div>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
