<!doctype html>
<html>
  <head>
    <!-- [Lucky] Viewport meta for mobile responsiveness -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Sketchcord</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Sketchcord</h1>

    <!-- [Lucky] Username login screen — shown before chat -->
    <div id="login">
      <h2>Enter your username</h2>
      <input
        type="text"
        id="usernameInput"
        placeholder="Username"
        maxlength="20"
      />
      <button id="joinBtn">Join</button>
    </div>

    <div id="app" style="display: none">
      <!-- [Lucky] Show logged-in username -->
      <div id="userBar">Logged in as: <span id="displayName"></span></div>
      <div id="thread"></div>

      <div id="messaging">
        <div id="userDisplay"></div>
        <h2>Draw your message</h2>
        <canvas id="drawingCanvas"></canvas>
        <div id="controls">
          <button id="clearBtn">Clear</button>
          <button id="sendBtn">Send</button>
        </div>
      </div>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
